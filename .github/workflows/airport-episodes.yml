name: Airport bölümlerini güncelle

on:
  schedule:
    # Her pazartesi Türkiye saatiyle 11:00'de (UTC+3, Türkiye DST kullanmıyor -
    # bu yuzden 08:00 UTC) tv.haberturk.com'daki Airport program sayfasını
    # kontrol eder (program her Pazar 12:15'te yayınlanıyor). Yeni bölüm
    # yoksa hiçbir şey değiştirmez.
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-airport-episodes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update Airport bölümleri
        run: python3 scripts/update_airport_episodes.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- main-site/index.html main-site/televizyon/index.html; then
            echo "Degisiklik yok, commit atlanıyor."
            exit 0
          fi
          git config user.name "airport-episodes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add main-site/index.html main-site/televizyon/index.html
          git commit -m "Airport bölümlerini otomatik güncelle (tv.haberturk.com)"
          git push
