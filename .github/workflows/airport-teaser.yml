name: Bu Hafta Airport'ta güncelle

on:
  schedule:
    # Her gün 06:00 UTC'de kontrol eder (haber.aero haftalik "Airport'ta bu
    # hafta" yazisini genelde Cuma/Cumartesi yayinliyor; gunluk kontrol
    # gecikme olmadan yakalar). Zaten guncelse hicbir sey degistirmez.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-teaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install Pillow

      - name: Update Airport teaser
        run: python3 scripts/update_airport_teaser.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- main-site/index.html main-site/images; then
            echo "Degisiklik yok, commit atlanıyor."
            exit 0
          fi
          git config user.name "airport-teaser-bot"
          git config user.email "actions@users.noreply.github.com"
          git add main-site/index.html main-site/images
          git commit -m "Bu Hafta Airport'ta bölümünü otomatik güncelle (haber.aero)"
          git push
